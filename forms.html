<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="u1">Username:</label>
        <input type="text" id="u1" name="uname" maxlength="7" placeholder="Enter username" size="50" type="password">
        <br>
        <label for="p1">password:</label>
        <input type="password" id="p1" name="pass" placeholder="enter your password" size="15">
        <br>
        <label for="e1">email:</label>
        <input type="email" id="e1" name="email" placeholder="enter the email" size="20">
        <br>
        <label for="add1">Enter address:</label>
        <textarea name="address" id="add1" rows="10" cols="30">punjab</textarea>
        <br>
        <label for="h1">Hobbies:</label>
        <input type="checkbox" name="hobby" id="cook1" value="cooking">
        <label for="cook1">cooking</label>
        <input type="checkbox" name="hobby" id="sing1" value="singing">
        <label for="sing1">singing</label>
        <input type="checkbox" name="hobby" id="speak1" value="speaking">
         <label for="speak1">public speaking</label>

         <br>
         <label for="h1"> Select Course:</label>
         <input type="radio" name="course" id="c1" value="B tech." checked>
         <label for="c1"></label>B tech.</label>
         <input type="radio" name="course" id="c2" value="BCA">
         <label for="c2"></label>BCA</label>
         <input type="radio" name="course" id="c3" value="Bsc">
         <label for="c3"></label>Bsc</label>
         <br>

         <label for="state1"> choose state</label>
         <select name="state" id="state1" size="3" multiple>
            <option value="punjab">Punjab</option>
            <option value="uttrakhand">Uttrakhand</option>
            <option value="uttarpradesh">Uttarpradesh</option>

            
        </select>

         <br>





        <input type="submit">
    </form>
    
</body>
</html>
