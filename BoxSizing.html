<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
            width: 800px;
            height: 500px;
            background-color: pink;
            border: 5px solid brown;
            position: relative;
        }
        #d1{
            width: 200px;
            height: 150px;
            background-color: aqua;
            border: 2px solid red ;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 10px 10px 10px 5px palevioletred;
            position: relative;
            left: 50px;
            top: 30px;
            z-index: 3;
           /* transition: 1s transform;*/
           animation: move 2s infinite alternate;
        }
        @keyframes move {
            from{
                transform: scale(2);
            }
            to{
                transform: scale(0);
            }
            
        }
        #d1:hover{
            /*transform: rotate(40deg);*/
            /*transform: skew(40deg);*/
            transform: scale(2);
        }
       /* #d2{
            width: 200px;
            height: 150px;
            background-color: aqua;
            border: 2px solid red ;
            padding: 20px;
            box-sizing: border-box;
            position: absolute;
            left: 100px;
            top: 100px;
            z-index: 2;
        }*/
        
    </style>
</head>
<body>
    <div id="parent">
    <div id="d1"> This is div section.</div>
    <!--<div id="d2"> This is second div.</div>-->
    </div>
</body>
</html>
