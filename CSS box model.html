<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 300px;
            min-height: 300px;
            background-color: peachpuff;
            border: 10px double red; /*this is also shorthend property.*/
            padding: 40px;
            margin: 40px;
            /*border-width: 20px
            border-color: red 
            border-style: dashed */
            border-radius: 50px;
            margin: auto; /*will show the box in the middle.*/

            /* TEXT-FORMATTING PROPERTIES*/
            font-size: 20px;
            font-style: italic;
            font-weight: 700;
            font-family:'Times New Roman', Times, serif;
            text-align: left;
            text-align-last: right;
            text-transform: capitalize;
            text-decoration-style: dotted;
            text-decoration-line: underline;
            word-spacing: 5px;
            line-height: 30px;
            letter-spacing: 2px;
            text-shadow: 5px 5px 3px green;
        }
        

    </style>
</head>
<body>

</html>
